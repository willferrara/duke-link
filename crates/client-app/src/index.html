<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duke Link</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.02-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z" fill="currentColor" />
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2.5 4.5 5.6v5.8c0 4.9 3.2 9.3 7.5 10.6 4.3-1.3 7.5-5.7 7.5-10.6V5.6L12 2.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.5M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
      <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="1.8" />
    </symbol>
  </svg>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" aria-hidden="true"><use href="#icon-shield" /></svg>
        <div>
          <h1>Duke Link</h1>
          <p class="subtitle">Horizon MC P2P Friend Joiner</p>
        </div>
      </div>
      <button id="btn-refresh" class="icon-btn" type="button" title="Refresh server status" aria-label="Refresh server status">
        <svg viewBox="0 0 24 24"><use href="#icon-refresh" /></svg>
      </button>
    </header>

    <section class="card status-card" aria-live="polite">
      <div class="status-row">
        <div class="server-meta">
          <span id="status-dot" class="status-dot offline"></span>
          <div>
            <h2 id="server-name">Not configured</h2>
            <p id="server-motd" class="muted">Paste an invite ticket to connect</p>
          </div>
        </div>
        <div id="status-pill" class="pill offline">Offline</div>
      </div>

      <div class="metrics-grid">
        <div class="metric">
          <span class="metric-label">Players</span>
          <span id="metric-players" class="metric-value mono">-- / --</span>
        </div>
        <div class="metric">
          <span class="metric-label">Transport</span>
          <span id="metric-path" class="metric-value mono">Idle</span>
        </div>
        <div class="metric">
          <span class="metric-label">Ping</span>
          <span id="metric-ping" class="metric-value mono">-- ms</span>
        </div>
      </div>
    </section>

    <section id="setup-card" class="card setup-card">
      <button id="setup-toggle" class="card-header-btn" type="button" aria-expanded="true">
        <span class="card-title">Connection &amp; Profile</span>
        <span id="setup-summary" class="muted mono">Setup required</span>
        <svg class="chevron" aria-hidden="true"><use href="#icon-chevron" /></svg>
      </button>

      <div id="setup-body" class="setup-body">
        <label class="field">
          <span>Invite Ticket</span>
          <input id="input-ticket" type="text" class="mono" placeholder="duke1:..." autocomplete="off" spellcheck="false" />
        </label>

        <label class="field">
          <span>In-Game Username</span>
          <input id="input-username" type="text" placeholder="Player" maxlength="16" autocomplete="off" spellcheck="false" />
        </label>

        <div class="id-row">
          <span class="metric-label">Your Endpoint ID (share with host)</span>
          <div class="id-box">
            <code id="client-endpoint-id" class="mono">loading...</code>
            <button id="btn-copy-id" class="copy-btn" type="button" title="Copy Endpoint ID" aria-label="Copy Endpoint ID">
              <svg viewBox="0 0 24 24"><use href="#icon-copy" /></svg>
            </button>
          </div>
        </div>

        <div class="setup-actions">
          <button id="btn-save" class="secondary-btn" type="button">Save Settings</button>
          <span id="setup-feedback" class="feedback"></span>
        </div>
      </div>
    </section>

    <section class="card sync-card">
      <div class="sync-header">
        <span id="sync-stage" class="card-title">Ready to Sync</span>
        <span id="sync-stats" class="mono muted">0 / 0 files &middot; 0.0 MB/s</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="sync-bar-track">
        <div id="sync-bar-fill" class="progress-fill"></div>
      </div>
      <p id="sync-file" class="muted mono truncate">Waiting for launch</p>
    </section>

    <footer class="cta-area">
      <button id="btn-play" class="play-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-play" /></svg>
        <span id="btn-play-label">Play</span>
      </button>
      <p id="global-status" class="muted status-footnote">Local tunnel binds 127.0.0.1:25565 on launch.</p>
    </footer>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
