name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-client:
    name: Build Windows Client (Tauri v2)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tauri CLI dependencies
        working-directory: crates/client-app
        run: npm install

      - name: Build Tauri v2 Windows client & NSIS installer
        working-directory: crates/client-app
        run: npm run tauri -- build --bundles nsis

      - name: Stage Windows release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item "target/release/duke-link-client.exe" "dist-win/duke-link-client-windows-x86_64.exe"
          Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist-win/"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: dist-win/*

  build-linux-relay:
    name: Build Linux x86_64 Relay Daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Build relay-daemon release binary
        run: cargo build --release -p relay-daemon

      - name: Stage Linux relay binary
        run: |
          mkdir -p dist-linux
          cp target/release/relay-daemon dist-linux/duke-link-relay-linux-x86_64
          chmod +x dist-linux/duke-link-relay-linux-x86_64

      - name: Upload Linux relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-relay
          path: dist-linux/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-client, build-linux-relay]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-relay
          path: release-assets

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
